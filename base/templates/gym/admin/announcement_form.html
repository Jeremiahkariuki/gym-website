{% extends 'gym/base.html' %}

{% block title %}{{ title }} - {{ block.super }}{% endblock %}

{% block content %}
<h1>{{ title }}</h1>
<a href="{% url 'admin_announcement_list' %}" class="back-link">← Back to Announcements</a>

<div class="card" style="max-width: 800px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div style="color: #e74c3c;">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Publish Announcement</button>
            <a href="{% url 'admin_announcement_list' %}" class="btn" style="background-color: #95a5a6;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
